<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Worksheet Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .worksheet-paper {
            aspect-ratio: 3 / 4;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mb-8">
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 p-6 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold">📝 AI Worksheet Generator</h1>
            <p class="text-indigo-100 mt-1">สร้างใบงานขนาด 3:4 สดใส คมชัด พร้อมดาวน์โหลดเป็น PDF/PNG</p>
        </div>

        <div class="p-6 md:p-8 space-y-4">
            <!-- Controls -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">📚 วิชา</label>
                    <input type="text" id="subject" value="คณิตศาสตร์" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">🎓 ชั้นเรียน</label>
                    <select id="grade" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="อนุบาล 3">อนุบาล 3</option>
                        <option value="ประถมศึกษาปีที่ 1">ประถมศึกษาปีที่ 1</option>
                        <option value="ประถมศึกษาปีที่ 2" selected>ประถมศึกษาปีที่ 2</option>
                        <option value="ประถมศึกษาปีที่ 3">ประถมศึกษาปีที่ 3</option>
                        <option value="ประถมศึกษาปีที่ 4">ประถมศึกษาปีที่ 4</option>
                        <option value="ประถมศึกษาปีที่ 5">ประถมศึกษาปีที่ 5</option>
                        <option value="ประถมศึกษาปีที่ 6">ประถมศึกษาปีที่ 6</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">🎨 สไตล์ / ธีม</label>
                    <input type="text" id="style" value="การ์ตูนสดใส น่ารัก มินิมอล" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">🧩 รูปแบบ Worksheet</label>
                    <select id="worksheetType" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="จับคู่คำตอบ">จับคู่คำตอบ (Matching)</option>
                        <option value="ปรนัย เลือกตอบ">ปรนัย / เลือกตอบ (Multiple Choice)</option>
                        <option value="เติมคำในช่องว่าง">เติมคำในช่องว่าง (Fill in blanks)</option>
                        <option value="โจทย์ปัญหา">โจทย์ปัญหาฝึกสมอง (Word Problems)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">⚖️ ระดับความยาก</label>
                    <select id="difficulty" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="ง่าย">ง่าย (Easy)</option>
                        <option value="ปานกลาง" selected>ปานกลาง (Medium)</option>
                        <option value="ท้าทาย">ท้าทาย (Hard)</option>
